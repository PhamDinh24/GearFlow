spring:
  application:
    name: gearflow-api

  datasource:
    url: jdbc:postgresql://localhost:5432/gearflow
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    clean-disabled: false
    repair-on-migrate: true

  cache:
    type: redis
    redis:
      time-to-live: 600000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: $(JWT_SECRET:gearflow-secret-key-2024-spring-boot-jwt-authentication-authorization-token-security)
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.gearflow: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/gearflow.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5173

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:def4abpgi}
  api-key: ${CLOUDINARY_API_KEY:182333839669878}
  api-secret: $(CLOUDINARY_API_SECRET:ooupF5SSAvpyQIyHeRyHQccCX2k)

