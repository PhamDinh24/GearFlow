spring:
  application:
    name: keyboard-shop-api
  datasource:
    url: jdbc:mysql://localhost:3306/keyboard_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: your-secret-key-change-this-in-production-environment-very-important
  expiration: 86400000

logging:
  level:
    root: INFO
    com.keyboard: DEBUG
