<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60D5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1e3a8a"/>
  
  <!-- Gear Icon -->
  <g transform="translate(32, 32)">
    <!-- Outer gear teeth -->
    <path d="M 0,-24 L 4,-20 L -4,-20 Z" fill="url(#faviconGradient)"/>
    <path d="M 0,24 L 4,20 L -4,20 Z" fill="url(#faviconGradient)"/>
    <path d="M -24,0 L -20,4 L -20,-4 Z" fill="url(#faviconGradient)"/>
    <path d="M 24,0 L 20,4 L 20,-4 Z" fill="url(#faviconGradient)"/>
    
    <!-- Diagonal teeth -->
    <path d="M -17,-17 L -14,-20 L -20,-14 Z" fill="url(#faviconGradient)"/>
    <path d="M 17,-17 L 20,-14 L 14,-20 Z" fill="url(#faviconGradient)"/>
    <path d="M -17,17 L -20,14 L -14,20 Z" fill="url(#faviconGradient)"/>
    <path d="M 17,17 L 14,20 L 20,14 Z" fill="url(#faviconGradient)"/>
    
    <!-- Main gear body -->
    <circle cx="0" cy="0" r="16" fill="url(#faviconGradient)"/>
    <circle cx="0" cy="0" r="8" fill="#1e3a8a"/>
    
    <!-- Keyboard symbol inside -->
    <rect x="-6" y="-3" width="12" height="6" rx="1" fill="#60D5FA" opacity="0.8"/>
    <rect x="-4" y="-1" width="2" height="2" rx="0.5" fill="#1e3a8a"/>
    <rect x="0" y="-1" width="2" height="2" rx="0.5" fill="#1e3a8a"/>
  </g>
</svg>