<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60D5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear Icon -->
  <g transform="translate(20, 30)">
    <!-- Outer gear teeth -->
    <circle cx="0" cy="0" r="18" fill="url(#blueGradient)" opacity="0.3"/>
    <path d="M 0,-20 L 3,-16 L -3,-16 Z" fill="url(#blueGradient)"/>
    <path d="M 0,20 L 3,16 L -3,16 Z" fill="url(#blueGradient)"/>
    <path d="M -20,0 L -16,3 L -16,-3 Z" fill="url(#blueGradient)"/>
    <path d="M 20,0 L 16,3 L 16,-3 Z" fill="url(#blueGradient)"/>
    
    <!-- Main gear body -->
    <circle cx="0" cy="0" r="14" fill="url(#blueGradient)"/>
    <circle cx="0" cy="0" r="6" fill="#1e3a8a"/>
  </g>
  
  <!-- Keyboard Icon -->
  <g transform="translate(55, 30)">
    <!-- Keyboard base -->
    <rect x="-15" y="-8" width="30" height="16" rx="2" fill="url(#blueGradient)"/>
    <!-- Keys -->
    <rect x="-12" y="-5" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="-6" y="-5" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="0" y="-5" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="6" y="-5" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="-12" y="1" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="-6" y="1" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="0" y="1" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
    <rect x="6" y="1" width="4" height="4" rx="1" fill="#1e3a8a" opacity="0.6"/>
  </g>
  
  <!-- Text: GearFlow -->
  <text x="90" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#blueGradient)">
    GearFlow
  </text>
</svg>